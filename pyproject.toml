[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sme-closure-signal"
version = "0.1.0"
description = "소상공인 폐업위험 조기신호 데이터레시피 분석 패키지"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]

[project.scripts]
sme-closure-signal = "sme_closure_signal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
